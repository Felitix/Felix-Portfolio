backend:
  name: git-gateway
  branch: main

media_folder: 'uploads'
public_folder: '/uploads'

collections:
  # --------------------------------------------------------------------------
  # 1. PROJECTS COLLECTION (Individual Files inside content/projects/)
  # --------------------------------------------------------------------------
  - name: 'projects'
    label: 'Projects'
    folder: 'content/projects'
    create: true
    slug: '{{slug}}'
    format: 'json'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - {
          label: 'Display Order / Priority',
          name: 'order',
          widget: 'number',
          default: 1,
        }
      - {
          label: 'Published / Visible',
          name: 'published',
          widget: 'boolean',
          default: true,
        }
      - { label: 'Project Thumbnail', name: 'thumbnail', widget: 'image' }
      - { label: 'Short Description', name: 'description', widget: 'text' }
      - {
          label: 'Tech Stack (Comma Separated)',
          name: 'tech_stack',
          widget: 'list',
        }
      - {
          label: 'GitHub Repo URL',
          name: 'github_url',
          widget: 'string',
          required: false,
        }
      - {
          label: 'Live Demo URL',
          name: 'live_url',
          widget: 'string',
          required: false,
        }
      - {
          label: 'Related Devlog/Blog Slug',
          name: 'devlog_slug',
          widget: 'string',
          required: false,
        }

  # --------------------------------------------------------------------------
  # 2. BLOG COLLECTION (Individual Files inside content/blog/)
  # --------------------------------------------------------------------------
  - name: 'blog'
    label: 'Blog Posts'
    folder: 'content/blog'
    create: true
    slug: '{{slug}}'
    format: 'json'
    fields:
      - { label: 'Post Title', name: 'title', widget: 'string' }
      - {
          label: 'Publish Date',
          name: 'date',
          widget: 'datetime',
          format: 'YYYY-MM-DD',
          default: '',
        }
      - {
          label: 'Display Order / Priority',
          name: 'order',
          widget: 'number',
          default: 1,
        }
      - {
          label: 'Published / Visible',
          name: 'published',
          widget: 'boolean',
          default: true,
        }
      - {
          label: 'Read Time (e.g., 5 min read)',
          name: 'read_time',
          widget: 'string',
          default: '3 min read',
        }
      - {
          label: 'Category Tag',
          name: 'category',
          widget: 'string',
          default: 'General',
        }
      - { label: 'Short Excerpt', name: 'excerpt', widget: 'text' }
      - { label: 'Full Article Content', name: 'content', widget: 'markdown' }
